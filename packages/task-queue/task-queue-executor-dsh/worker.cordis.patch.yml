# Final restriction layer for a task-queue DSH worker. The executor passes this
# after the task-worker profile and every user/home patch, so the shipped
# recursive orchestration and shell rows cannot reactivate in the child.

- id: hmr
  disabled: true

# Process jobs stay unavailable. Foreground shell is retained as a sandboxed
# worker capability so installed Skills can invoke their required CLIs.
- id: jobs
  disabled: true
- id: bash-sandbox
  disabled: !!js process.platform === 'win32'
- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32'
- id: shell-env
  disabled: false
- id: permission
  disabled: true
- id: tool-bash
  disabled: !!js process.platform === 'win32'
  config:
    enableRunInBackground: false
- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false
- id: tool-jobs
  disabled: true

# Recursive durable work.
- id: task-queue
  disabled: true
- id: task-queue-executor-dsh
  disabled: true
- id: tool-task-queue
  disabled: true
- id: tool-agent-run-task-queue
  disabled: true
- id: image-generation-task-queue
  disabled: true
- id: tool-image-generation-task-queue
  disabled: true
- id: command-task-queue
  disabled: true
- id: task-queue-remote
  disabled: true

# Multi-round goals.
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true

# Child delegation and Ralph, which delegates through subagents.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: subagent-codex
  disabled: true
- id: subagent-claude-code
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-ralph
  disabled: true

# Workflow fan-out.
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
