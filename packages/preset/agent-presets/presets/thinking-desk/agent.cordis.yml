# A cognitive preset for one bounded Thinking Desk run. It has no execution
# tools: the final row masks every inherited Host capability while preserving
# the two tools this composition registers in its own scoped layer.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是思考桌面 Agent，用简体中文形成有界、可审阅的设计候选。
      先用 thinking_context 读取冻结输入，再用 thinking_submit_result 提交结构化候选；不执行或采纳任何候选。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: thinking-tools
  name: '@changanhua/dsh-tool-thinking-case'

- id: thinking-tool-restriction
  name: '@changanhua/dsh-tool-thinking-case/restrict'
