name: Fork CI (Windows)

on:
  pull_request:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_BUILD_CLIENT_PROFILE: official
  DSH_TELEMETRY_DISABLED: '1'
  PERSONAL_DELIVERY_BASELINE_SHA: 527338cf077a475e82b718faa12cc16bfc82283f

concurrency:
  group: fork-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows build and typecheck
    if: >-
      github.repository == 'changanhua/deepseek-harness'
      && github.actor == 'changanhua'
      && github.event.pull_request.user.login == 'changanhua'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install immutable dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Check package identities
        shell: pwsh
        run: pnpm run check:package-identities
      - name: Check private core patch budget
        shell: pwsh
        run: pnpm run check:core-patches
      - name: Build repository
        shell: pwsh
        run: pnpm run build
      - name: Verify personal source distribution
        shell: pwsh
        run: pnpm run verify:personal-source
      - name: Confirm client typecheck
        shell: pwsh
        run: pnpm run typecheck:contracts-ready

  c0-diff:
    name: C0 differential quality
    if: >-
      github.repository == 'changanhua/deepseek-harness'
      && github.actor == 'changanhua'
      && github.event.pull_request.user.login == 'changanhua'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: head
          persist-credentials: false
      - name: Detect Delivery C0 scope
        id: scope
        working-directory: head
        shell: pwsh
        run: |
          $pullRequestBase = "${{ github.event.pull_request.base.sha }}"
          $pullRequestHead = "${{ github.event.pull_request.head.sha }}"
          $baseline = $env:PERSONAL_DELIVERY_BASELINE_SHA
          $trustedBase = $pullRequestBase
          git merge-base --is-ancestor $baseline $pullRequestBase
          $baseContainsBaseline = $LASTEXITCODE -eq 0
          git merge-base --is-ancestor $baseline $pullRequestHead
          $headContainsBaseline = $LASTEXITCODE -eq 0
          if (-not $baseContainsBaseline -and $headContainsBaseline) {
            $trustedBase = $baseline
          }
          "trusted_base=$trustedBase" >> $env:GITHUB_OUTPUT
          Write-Host "C0 trusted base: $trustedBase"

          $changed = @(git diff --name-only $pullRequestBase $pullRequestHead)
          $c0 = @($changed | Where-Object {
            $_ -match '^(packages/delivery/|packages/bundle/personal-delivery/|packages/client/ui-delivery/|docs/subsystems/delivery[./]|docs/specs/2026-08-29-personal-delivery)'
          })
          $hasC0 = $c0.Count -gt 0
          "has_c0=$($hasC0.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $c0 | ForEach-Object { Write-Host "C0 path: $_" }
      - name: Check out trusted base
        if: steps.scope.outputs.has_c0 == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.scope.outputs.trusted_base }}
          fetch-depth: 0
          path: base
          persist-credentials: false
      - name: Enable Developer Mode
        if: steps.scope.outputs.has_c0 == 'true'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - if: steps.scope.outputs.has_c0 == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - if: steps.scope.outputs.has_c0 == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Install base and head dependencies
        if: steps.scope.outputs.has_c0 == 'true'
        shell: pwsh
        run: |
          pnpm --dir base install --frozen-lockfile
          pnpm --dir head install --frozen-lockfile
      - name: Build base and head contracts
        if: steps.scope.outputs.has_c0 == 'true'
        shell: pwsh
        run: |
          pnpm --dir base run build
          pnpm --dir head run build
      - name: Run C0 differential gates
        if: steps.scope.outputs.has_c0 == 'true'
        shell: pwsh
        run: >-
          pnpm --dir head run check:ci:fork-c0-diff --
          --base-dir "${{ github.workspace }}/base"
          --head-dir "${{ github.workspace }}/head"
          --base-sha "${{ steps.scope.outputs.trusted_base }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
      - name: Run focused C0 tests and coverage
        if: steps.scope.outputs.has_c0 == 'true'
        working-directory: head
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/delivery
          packages/bundle/personal-delivery/tests
          packages/client/ui-delivery/tests
          scripts/test-invariants.spec.ts
          --coverage
          --coverage.include="packages/delivery/**/src/**/*.ts"
          --coverage.include="packages/bundle/personal-delivery/src/**/*.ts"
          --coverage.include="packages/client/ui-delivery/src/**/*.ts"

  fork-checks:
    name: fork checks passed
    needs: [windows-build, c0-diff]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every fork check
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:REPOSITORY -ne 'changanhua/deepseek-harness'
            -or $env:ACTOR -ne 'changanhua'
            -or $env:AUTHOR -ne 'changanhua'
            -or $env:HEAD_REPOSITORY -ne $env:REPOSITORY) {
            Write-Error "Fork checks reject this pull request identity."
            exit 1
          }
          $results = "${{ join(needs.*.result, ', ') }}"
          if ($results -match 'failure|cancelled|skipped') {
            Write-Error "Fork check results: $results"
            exit 1
          }
          Write-Host "Fork checks succeeded: $results"
