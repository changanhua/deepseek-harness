name: Task 5 runtime inspect finalize

on:
  push:
    branches: [docs/runtime-awareness-design]
  pull_request:
    branches: [docs/runtime-awareness-design]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/runtime-awareness-design
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Wire Task 5 into project and web bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          host = Path('tsconfig.host.json')
          text = host.read_text()
          needle = '    { "path": "./packages/extensions/tool-cordis" },\n'
          row = '    { "path": "./packages/extensions/tool-runtime-inspect" },\n'
          if row not in text:
              if needle not in text:
                  raise SystemExit('tool-cordis host reference anchor not found')
              text = text.replace(needle, needle + row, 1)
              host.write_text(text)

          manifest = Path('packages/bundle/web-app/package.json')
          text = manifest.read_text()
          anchor = '    "@deepseek-ai/dsh-session-projection-cache": "workspace:^",\n'
          additions = (
              '    "@deepseek-ai/dsh-runtime-facts": "workspace:^",\n'
              '    "@deepseek-ai/dsh-runtime-facts-host": "workspace:^",\n'
              '    "@deepseek-ai/dsh-tool-runtime-inspect": "workspace:^",\n'
          )
          if '"@deepseek-ai/dsh-tool-runtime-inspect"' not in text:
              if anchor not in text:
                  raise SystemExit('web-app dependency anchor not found')
              text = text.replace(anchor, ''.join(additions) + anchor, 1)
              manifest.write_text(text)

          patch = Path('packages/bundle/web-app/cordis.patch.yml')
          text = patch.read_text()
          anchor = '- insert:\n    - id: code-runtime\n'
          rows = '''- insert:\n    # Runtime Awareness host plane: facts are authoritative state; the tool is\n    # the explicit long-tail inspection surface. All three are web-profile\n    # composition, not Agent-owned facts or provider heuristics.\n    - id: runtime-facts\n      name: '@deepseek-ai/dsh-runtime-facts'\n\n    - id: runtime-facts-host\n      name: '@deepseek-ai/dsh-runtime-facts-host'\n\n    - id: tool-runtime-inspect\n      name: '@deepseek-ai/dsh-tool-runtime-inspect'\n\n    - id: code-runtime\n'''
          if '    - id: tool-runtime-inspect\n' not in text:
              if anchor not in text:
                  raise SystemExit('web-app insert anchor not found')
              text = text.replace(anchor, rows, 1)
              patch.write_text(text)
          PY
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo 'No wiring changes needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tsconfig.host.json packages/bundle/web-app/package.json packages/bundle/web-app/cordis.patch.yml pnpm-lock.yaml
          git commit -m 'feat(runtime-inspect): wire web bundle and project graph'
          git push origin HEAD:docs/runtime-awareness-design
