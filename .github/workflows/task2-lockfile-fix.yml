name: Task 2 lockfile fix

on:
  push:
    branches:
      - docs/runtime-awareness-design

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/runtime-awareness-design
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19'
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: sync lockfile for web settings'
          git push origin HEAD:docs/runtime-awareness-design
