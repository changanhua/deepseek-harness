architecture:
  planning:
    status: implemented_workspace_v0
    role: >-
      Durable canonical work-object layer across Sessions. Planning owns the accepted project
      state and its revision history; Sessions advance a Plan or Focus, while external systems
      retain ownership of external facts and execution authority.
    current_model:
      canonical_revision:
        fields:
          - title
          - intent
          - stateEntries
          - scope
          - acceptance
          - sources
          - estimate
          - reviewAt
        state_entries:
          kinds:
            - objective
            - accepted
            - open
          stable_identity: true
          note: >-
            StateEntry IDs remain stable across revisions; retired IDs cannot be silently reused.
            Legacy intent/scope/acceptance remain supported and are not auto-filled by migration.
      durable_board:
        - items
        - lanes
        - dependencies
        - reviews
        - proposals
        - focuses
        - resourceLinks
        - sessionBindings
        - handoffs
        - events
      subject_model:
        kinds:
          - plan
          - focus
        note: >-
          PlanningSubjectRef explicitly identifies whether work is acting on the whole Plan
          or one Focus, independent of the current UI selection.
      focus:
        implemented: true
        semantics:
          - Focus is optional and belongs to one Plan.
          - Focus has title, optional objective, status, and version.
          - Focus status is open/active/blocked/done.
          - Focus done does not complete the parent Plan.
          - Focus is not a Delivery task hierarchy.
      resources:
        implemented: true
        shape:
          - kind
          - id
          - provider
          - revision
          - label
        note: >-
          ResourceRef is opaque and extensible. Planning stores identity/linkage only;
          Session transcripts, SBC state, solver results, browser facts, Git artifacts,
          and Delivery state remain owned by their original systems.
      session_binding:
        implemented: true
        fields:
          - sessionId
          - subject
          - baseRevision
        note: >-
          A Session remains bound to its original Plan/Focus and base revision even when
          the browser later selects another Planning object.
      context_pack:
        implemented: true
        function: buildPlanningContext
        semantics:
          - Projects current objective/accepted/open entries.
          - Includes legacy intent/scope/acceptance for compatibility.
          - Includes selected Focus when the subject is a Focus.
          - Includes opaque related resource links.
          - Does not expand historical Session transcripts.
      proposal_delta:
        implemented: true
        note: >-
          Existing Proposal generations may carry a PlanningProposedDelta containing subject,
          baseRevision, operations, originRef, and evidenceRefs. Exact-generation adoption
          validates the base revision and applies the operation set atomically before advancing
          the canonical revision. Stale bases are rejected without partial mutation.
        operations:
          - add-state-entry
          - update-state-entry
          - remove-state-entry
          - create-focus
          - update-focus
          - add-resource-link
          - remove-resource-link
      workbench:
        implemented: true
        capabilities:
          - Shows objective, accepted, and open canonical state.
          - Creates and selects optional Focus objects.
          - Changes Focus status.
          - Starts a native Session for the selected Plan/Focus.
          - Shows Session bindings and their base revisions.
          - Shows related resource references without duplicating external state.
          - Keeps Proposal review/adoption separate from canonical state.
          - Preserves sources, revisions, reviews, dependencies, evolution, and Delivery projections.
      mcp:
        implemented: true
        capabilities:
          - Project-aware Planning discovery, list, exact read, and proposal intake through the existing connector.
          - Optional proposed delta can target a Plan/Focus and carry external origin/evidence refs.
          - MCP caller cannot forge trusted Session provenance, adopt proposals, dispatch Delivery, or mutate Memory.
      evolution:
        implemented: true
        note: >-
          Deterministic projection from retained Planning data; it does not call a model and
          does not invent history that the Board never stored.
      execution_boundary:
        - Planning adoption is not execution permission.
        - Delivery and Queue own requirement approval, dispatch, execution, verification, evidence, and human acceptance.
        - Planning reads linked Delivery projections/evidence and does not persist a competing execution-state copy.
      source_boundary:
        - Verified Session-event sources and captured Content versions provide provenance, not authority.
        - Manual/link sources and MCP external refs remain explicitly unverified unless an owning system proves otherwise.
    sbc_workspace_pilot:
      status: implemented_and_tested
      path: apps/web/tests/planning-workspace.e2e.ts
      bundle_test: packages/bundle/personal-planning/tests/workspace-pilot.spec.ts
      verified_flow: >-
        Plan -> Focus -> Session binding -> SBC/browser/solver refs -> proposed delta ->
        explicit exact adoption -> new canonical revision -> restart persistence.
      safety_fact: >-
        The isolated pilot asserts that SBC-specific fields such as rating, chemistry,
        formation, inventory, and players do not enter Planning core state.
    remaining_limits:
      - Thinking Desktop itself is not implemented by Planning Workspace v0.
      - External ResourceRef values remain opaque; Planning does not dereference or own their live domain state.
      - Stale proposal bases are rejected; automatic semantic rebase is not part of the current contract.
      - Planning remains a bounded single-writer Board and is not a multi-host collaborative store.
    authority_paths:
      - .agents/notes/implemented/architecture/2026-09-27-project-planning-and-execution-boundaries.zh.md
      - docs/subsystems/planning.zh.md
      - packages/planning/planning/src/schema.ts
      - packages/planning/planning/src/context.ts
      - packages/planning/planning-local/src/workspace.ts
      - packages/client/ui-planning/src/client/PlanningObject.tsx
      - packages/client/ui-planning/src/client/PlanningSessionBinding.tsx
      - packages/mcp/mcp-gateway/src/planning.ts
      - apps/web/tests/planning-workspace.e2e.ts
      - packages/bundle/personal-planning/tests/workspace-pilot.spec.ts

  thinking_desktop:
    status: design_only_with_planning_bridge_ready
    intended_role: >-
      Non-destructive cognitive workspace over external work objects. It should own temporary
      representation, context, selection/attention, hypotheses, relations, branches/ghosts,
      views, and transformations; it must not become a second canonical Planning store.
    planning_relationship:
      - Planning remains the canonical commit boundary for durable work state.
      - PlanningSubjectRef already provides a mount target for a whole Plan or one Focus.
      - ResourceRef can later carry thinking-workspace identities without changing Planning core.
      - PlanningProposedDelta already provides the explicit proposal boundary for exploration results.
      - Thinking Desktop must not silently mutate Planning; explicit adoption remains required.
      - External systems continue to own external reality; the desktop should reference rather than duplicate it.
    design_principle: "Reference -> Transform -> Propose"
    not_yet_implemented:
      - Canvas/workspace UI
      - Context and attention model
      - Temporary relations and hypotheses
      - Ghost/branch/what-if exploration
      - Thinking-workspace persistence

  browser_platform:
    status: implemented_personal_platform
    role: >-
      Personal browser extension and BrowserTask capabilities provide task-scoped page evidence,
      bounded browser operations, write recovery, lifecycle reconnection, and durable task acceptance.
    authority_paths:
      - FORK-DIVERGENCE.md
      - docs/subsystems/browser.zh.md
      - packages/mcp/browser-extension-mcp
      - apps/chrome-extension

  task_queue:
    status: implemented
    role: durable cross-session task execution and recovery owner
    authority_path: FORK-DIVERGENCE.md

  project_memory:
    status: implemented
    role: source-backed project memory with explicit human acceptance
    authority_path: FORK-DIVERGENCE.md

  knowledge:
    status: implemented
    role: source-grounded editable knowledge libraries with durable execution/recovery and immutable releases
    authority_path: FORK-DIVERGENCE.md

integration_boundaries:
  fc27_sbc:
    status: validated_external_domain
    rule: >-
      SBC requirements, player identities, chemistry, inventory, solver outputs, browser slots,
      prices, and transaction state belong to SBC/browser/solver domains, not Planning core.
    planning_use: >-
      Planning carries the durable work intent, Focus, canonical state, Session binding and
      opaque resource/evidence references; SBC/browser/solver systems keep their own domain truth.

next_design_direction:
  priority: use_workspace_v0_on_real_cases
  goal: >-
    Stop redesigning the Planning kernel by default. Exercise the implemented canonical work-object
    contract on real SBC and other DSH cases, and only promote gaps that appear in actual use.
  preserve:
    - Immutable canonical Revision and stable StateEntry identities.
    - Optional Focus rather than mandatory task decomposition.
    - Explicit SubjectRef and Session base-revision binding.
    - Extensible opaque ResourceRef with external ownership.
    - Proposal Delta plus explicit exact-generation adoption.
    - CAS/version conflict rejection.
    - Provenance and exact source identities.
    - Delivery/Queue/Memory/Knowledge fact ownership.
    - Thinking Desktop as a future non-destructive exploration layer, not another truth store.

