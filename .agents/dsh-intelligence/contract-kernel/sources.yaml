    path: packages/context/command-profile/README.md
    origin: local-worktree
    artifact_kind: source
  - id: task-queue-readme
    path: packages/task-queue/task-queue/README.md
    origin: local-worktree
    artifact_kind: source
  - id: runtime-awareness-e2e
    path: examples/headless-agent/tests/runtime-awareness.behavior.e2e.ts
    origin: local-worktree
    artifact_kind: source
  - id: tool-skill-readme
    path: packages/skill/tool-skill/README.md
    origin: local-worktree
    artifact_kind: source
  - id: fork-divergence
    path: FORK-DIVERGENCE.md
