<div class="app" id="app"><aside class="sidebar" aria-label="主导航"><div class="brand row"><div class="mark">D</div><div><strong>DSH</strong><p>PERSONAL WORKSPACE</p></div></div><button class="btn new" data-action="new">＋<span class="grow">随手聊聊</span><span class="small muted">↗</span></button><nav id="nav"></nav><div class="sidefoot"><button class="navitem" data-route="tools"><span data-icon="layers"></span>能力与工具</button><button class="navitem" data-action="settings"><span data-icon="settings"></span>设置</button><div class="profile row"><div class="avatar">X</div><div class="grow">我的工作空间<div class="connection"><i class="dot"></i>本地 · 示例环境</div></div><span class="small muted">个人版</span></div></div></aside><div class="shell"><header class="topbar"><div class="row"><button class="iconbtn mobilemenu" data-action="menu" aria-label="切换导航"><span data-icon="menu"></span></button><div class="row crumb" id="crumb"></div></div><div class="row"><span class="proto">交互原型 · 示例数据</span><button class="iconbtn" data-action="search" aria-label="搜索工作"><span data-icon="search"></span></button></div></header><main id="main"></main></div></div><dialog id="dialog"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const paths={home:'M3 10 12 3l9 7v10H3Z M9 20v-7h6v7',inbox:'M4 4h16l2 12v4H2v-4L4 4Z M2 15h6l2 3h4l2-3h6',clock:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',folder:'M3 6h6l2 2h10v12H3Z',arrow:'M5 12h14 M14 7l5 5-5 5',chevron:'m9 5 7 7-7 7',search:'M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16 M16 16l6 6',layers:'m12 3 10 5-10 5L2 8Z M2 12l10 5 10-5 M2 16l10 5 10-5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',file:'M5 3h9l5 5v13H5Z M14 3v6h5 M8 13h8 M8 17h6',code:'m8 6-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18',play:'m8 4 12 8-12 8Z',check:'m5 12 4 4L19 6',chat:'M3 4h18v13H9l-6 4Z M7 9h10 M7 13h6',close:'m6 6 12 12 M18 6 6 18',send:'M12 20V4 M5 11l7-7 7 7',link:'M9 15 15 9 M8 16l-2 2a4 4 0 0 1-6-6l5-5 M16 8l2-2a4 4 0 0 0-6-6L7 5',menu:'M4 6h16 M4 12h16 M4 18h16',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c5 5 5 13 0 18-5-5-5-13 0-18',pause:'M8 5v14 M16 5v14'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const works=[{id:'chrome',title:'Chrome 助手交互方案',project:'deepseek-harness',desc:'侧栏与页面协作 · 方案 v2 已整理',status:'待你查看',tone:'amber',time:'12 分钟前',icon:'globe'},{id:'review',title:'队列恢复机制审查',project:'deepseek-harness',desc:'需要确认重试边界后继续',status:'需要确认',tone:'amber',time:'35 分钟前',icon:'code'},{id:'research',title:'个人知识工作流调研',project:'临时工作',desc:'正在核对来源 · 已整理 4 / 6 篇资料',status:'进行中',tone:'blue',time:'刚刚',icon:'file'},{id:'easygo',title:'执行记录与结果展示',project:'easyGo',desc:'交互调整完成 · 3 个结果文件',status:'已完成',tone:'green',time:'昨天',icon:'code'},{id:'reader',title:'语义缩放阅读体验',project:'easyReader',desc:'章节导航与原文定位 · 讨论记录',status:'可继续',tone:'',time:'2 天前',icon:'file'}];
let route='home',selected='chrome',detailTab='result',projectTab='overview',chatOpen=false,accepted=false,approved=false,paused=false;
const chats={chrome:[],review:[],research:[],easygo:[],reader:[],scratch:[]},main=document.getElementById('main'),nav=document.getElementById('nav'),dialog=document.getElementById('dialog');
const badge=(t,c='')=>`<span class="badge ${c}"><i class="dot"></i>${t}</span>`;
const pending=()=>Number(!accepted)+Number(!approved);
function status(w){return w.id==='chrome'&&accepted?['已查看','green']:w.id==='review'&&approved?['已确认','green']:w.id==='research'&&paused?['已暂停','']:[w.status,w.tone]}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').textContent='',3500)}
function workRow(w){return `<button class="workrow" data-work="${w.id}"><span class="workicon">${icon(w.icon)}</span><span class="grow"><span class="worktitle">${w.title}</span><span class="workdesc">${w.project} · ${w.desc}</span></span><span>${badge(...status(w))}</span><span class="time">${w.time}</span>${icon('chevron')}</button>`}
const workList=items=>`<div class="worklist">${items.length?items.map(workRow).join(''):'<div class="empty">暂时没有需要处理的工作。</div>'}</div>`;
const section=(t,x='')=>`<div class="sectionhead"><h2>${t}</h2>${x}</div>`;
function discussionId(){return route.startsWith('discussion:')?route:route.startsWith('project:')?'discussion:'+route.slice(8):'scratch'}
function composer(){const project=discussionId()!=='scratch';return `<form class="compose" data-form="scratch"><textarea aria-label="开始新的对话" placeholder="有什么想做的？也可以只是聊聊。" rows="2" required></textarea><div class="row between"><span class="contextlabel">${icon('chat')} ${project?'项目讨论':'临时对话'} ${!project&&chats.scratch.length?'<button class="textbtn" data-action="collect" type="button">收进项目 ↗</button>':''}</span><button class="send" aria-label="发送">${icon('send')}</button></div></form>`}
function attention(){return pending()?`<div class="attention">${!accepted?`<button class="attentioncard" data-work="chrome"><div class="row between">${badge('结果待查看','amber')}${icon('file')}</div><h3>Chrome 助手交互方案</h3><p>页面操作、侧栏协作和结果去向，已经整理成一份可审阅的方案。</p><div class="attentionfoot"><span>deepseek-harness · 12 分钟前</span><span class="action">查看方案 ${icon('arrow')}</span></div></button>`:''}${!approved?`<button class="attentioncard" data-work="review"><div class="row between">${badge('需要你的决定','amber')}${icon('code')}</div><h3>重试前，先确认执行结果</h3><p>遇到响应中断时，需要确定是否允许自动重新执行已有操作。</p><div class="attentionfoot"><span>deepseek-harness · 35 分钟前</span><span class="action">处理问题 ${icon('arrow')}</span></div></button>`:''}</div>`:'<div class="worklist empty">需要你处理的事情都已看完，可以继续其他工作。</div>'}
function projects(){return `<div class="projects">${[['deepseek-harness','#6e8bd7','浏览器协作与个人执行工作台',`${pending()} 项需要处理`,65],['easyGo','#66a18e','执行调度与结果交付','最近更新于昨天',40],['easyReader','#a48dbd','阅读理解与原文探索','上次继续于 2 天前',28]].map(p=>`<button class="projectcard" data-route="project:${p[0]}"><div class="row"><i class="projectdot" style="background:${p[1]}"></i><strong>${p[0]}</strong></div><p>${p[2]}</p><span class="small muted">${p[3]}</span><div class="bar"><span style="width:${p[4]}%;background:${p[1]}"></span></div></button>`).join('')}</div>`}
function home(){return `<div class="content"><div class="heading"><div class="eyebrow">我的工作空间</div><h1>继续手上的事</h1><p>${pending()?`有 ${pending()} 件事情需要你看一下`:'需要你处理的事情都已看完'}，${paused?'调研已暂停':'还有一项调研正在进行'}。</p></div>${composer()}${section(`需要我处理 <span>${pending()}</span>`,`<button class="textbtn" data-route="inbox">查看全部 ${icon('arrow')}</button>`)}${attention()}${section('最近工作',`<button class="textbtn" data-route="recent">全部记录 ${icon('arrow')}</button>`)}${workList(works.slice(2))}${section('我的项目')}${projects()}<div class="footerhint"><span>工作有去处，对话有上下文。</span><span>示例数据 · 不连接实际任务</span></div></div>`}
function projectView(name){const items=works.filter(w=>w.project===name);return `<div class="content"><div class="heading row between"><div><div class="eyebrow">项目</div><h1>${esc(name)}</h1><p>${name==='deepseek-harness'?'浏览器协作与个人执行工作台':'让最近的工作、结果和讨论留在一起。'}</p></div><button class="btn" data-action="projectchat">${icon('chat')} 讨论这个项目</button></div><div class="tabs">${[['overview','概览'],['results','结果'],['discussions','相关讨论']].map(t=>`<button class="tab ${projectTab===t[0]?'active':''}" data-project-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${projectTab==='overview'?`<div class="projectintro"><div class="row">${icon('folder')}<strong>上次进行到这里</strong></div><p>${name==='deepseek-harness'?'Chrome 助手方案已整理，可以继续审阅页面与侧栏的协作方式。队列恢复机制的处理决定也保留在工作详情中。':name==='easyGo'?'执行记录展示已完成调整，可以打开结果查看改动。':'已经讨论章节导航与原文定位，下一步继续验证阅读时的跳转体验。'}</p></div>${section('当前工作')}${workList(items)}${section('相关资料')}<div class="worklist"><button class="workrow" data-action="source" style="grid-template-columns:35px 1fr 18px"><span class="workicon">${icon('link')}</span><span><span class="worktitle">项目知识与已有结论</span><span class="workdesc">思源 · 项目笔记</span></span>${icon('arrow')}</button></div>`:projectTab==='results'?`${section('最近产出')}${workList(items.filter(w=>w.id!=='review'))}`:`${section('继续讨论')}${workList(items)}<div style="margin-top:25px">${composer()}</div>`}</div>`}
function documentBody(w){if(detailTab==='record')return `<article class="document"><div class="eyebrow">执行记录 · 示例</div><h2>这项工作是怎样完成的</h2><div class="timeline">${[['09:14','读取相关材料','项目说明、已有讨论与引用资料'],['09:18','整理关键问题','提取交互方式、结果保存与执行边界'],['09:26',w.id==='research'?'核对来源':'生成结果供你查看',w.id==='research'?'4 / 6 篇材料已整理':'保留输入引用和本次执行记录']].map(s=>`<div class="event"><strong>${s[1]}</strong><p>${s[2]}</p><span class="small muted">${s[0]}</span></div>`).join('')}</div><div class="callout">执行结束和检查通过分别记录，查看结果后再决定下一步。</div></article>`;
 if(detailTab==='overview')return `<article class="document"><div class="eyebrow">工作概览</div><h2>${w.title}</h2><h3>这次要做什么</h3><p>${w.desc}。围绕已有材料继续工作，并保留可查看的结果。</p><h3>当前进展</h3><div>${badge(...status(w))}</div><h3>相关上下文</h3><div class="source">${icon('folder')} ${w.project}</div><div class="source">${icon('chat')} 相关讨论与执行记录</div><button class="btn" style="margin-top:25px" data-detail-tab="result">打开当前结果 ${icon('arrow')}</button></article>`;
 if(w.id==='chrome')return `<article class="document"><div class="docmeta"><span>方案文档</span><span>v2 · 本次产出</span></div><h2>让浏览器成为工作的现场</h2><p>阅读知乎、查阅资料或浏览项目页面时，直接围绕当前内容与 DSH 协作。浏览器提供现场，DSH 负责执行和记录，整理后的知识回到思源。</p><div class="callout">你停留在正在读的页面里，助手清楚“这次在处理什么”，也能把结果送到正确的位置。</div><h3>一次完整的使用过程</h3>${[['选择当前材料','引用当前页面或选中的段落，保留标题和原文链接。'],['在侧栏提出要求','先讨论、总结或对比；需要操作页面时显示具体动作。'],['查看结果并决定去向','直接阅读、继续修改，或确认后整理进思源。']].map((s,i)=>`<div class="docstep"><span class="stepnum">${i+1}</span><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}<h3>这版先关注</h3><ul><li>切换页面后，仍能看清助手正在引用哪份材料。</li><li>结果留在工作详情里，可以随时回到相关讨论。</li><li>需要长期执行的工作，从侧栏交给 DSH 继续处理。</li></ul><h3>相关材料</h3><button class="source" data-action="source">${icon('link')} 思源 · 浏览器助手使用边界 ${icon('arrow')}</button></article>`;
 if(w.id==='review')return `<article class="document"><div class="docmeta"><span>审查结果</span><span>${approved?'已确认处理方式':'1 个问题需要确认'}</span></div><h2>响应中断之后，如何安全继续？</h2><p>一次外部操作可能已经完成，但 DSH 尚未收到返回结果。此时直接重试，可能产生重复操作。</p><div class="callout">建议先查询已有执行结果。确认未执行时再重试；无法确定时，保留状态并请你处理。</div><h3>建议的处理顺序</h3><pre class="code">查询已有结果<br>  ├─ 已完成 → 恢复结果，不重复执行<br>  ├─ 未执行 → 允许重试<br>  └─ 无法确定 → 等待人工处理</pre><h3>你的决定</h3><p>是否采用这个恢复顺序，继续完成后续实现？</p><div class="row" style="margin-top:20px;flex-wrap:wrap"><button class="btn ${approved?'':'primary'}" data-action="approve">${icon('check')}${approved?'已采用建议（演示）':'采用建议（演示）'}</button><button class="btn" data-action="chat">补充意见</button></div></article>`;
 if(w.id==='research')return `<article class="document"><div class="docmeta"><span>资料调研</span><span>阶段性结果</span></div><h2>个人知识工作流调研</h2><div class="row between">${badge(paused?'已暂停':'正在核对来源',paused?'':'blue')}<span class="small muted">4 / 6 篇</span></div><div class="progress"><span></span></div><p>已整理资料采集、阅读加工、知识沉淀三个环节的使用方式，接下来核对跨工具协作的边界。</p><h3>目前整理出的要点</h3>${[['资料先保留来源','采集时间、原文地址与处理后的结论分开记录。'],['阅读与执行各有主界面','在思源整理知识，在 DSH 发起处理并检查结果。']].map((s,i)=>`<div class="docstep"><span class="stepnum">${i+1}</span><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}<h3>下一步</h3><p>交叉核对剩余两篇材料，整理为带来源的简短建议。</p><button class="btn" style="margin-top:20px" data-action="pause">${icon(paused?'play':'pause')} ${paused?'继续调研':'暂停调研'}（演示）</button></article>`;
 return `<article class="document"><div class="docmeta"><span>工作结果</span><span>${w.project}</span></div><h2>${w.title}</h2><p>${w.desc}。这份结果汇总本轮调整与下一步需要查看的部分。</p><h3>本轮变化</h3><div class="callout">${w.id==='easygo'?'将执行进度、结果文件和错误原因放到同一详情页，便于从结果回看过程。':'让章节结构与原文引用一起呈现，阅读摘要时可以直接定位到原文。'}</div><h3>结果文件</h3>${['交互说明.md','变更摘要.md','检查记录.md'].map(t=>`<button class="source" data-action="artifact">${icon('file')} ${t}</button>`).join('')}<h3>接下来</h3><p>打开相关讨论，补充使用反馈或继续下一轮调整。</p></article>`}
function messages(id){return (id==='scratch'?'':`<div class="message user">${id==='chrome'?'先整理页面和侧栏怎么协作，知识继续放思源。':id==='review'?'看看恢复机制还有没有重复执行的风险。':'继续处理这项工作，保留来源和结果。'}</div><div class="message assistant"><div class="agentname"><span class="mark">D</span> DSH</div>${id==='chrome'?'方案已放在主视图，分成引用材料、侧栏协作和结果去向三步。可以直接针对某一部分补充意见。':id==='review'?'有一个响应中断的场景需要确认，问题和建议处理顺序已放在审查结果里。':'当前结果已经整理到工作详情，可以继续补充要求。'}</div>`)+chats[id].map(m=>`<div class="message ${m.role}">${m.role==='assistant'?'<div class="agentname"><span class="mark">D</span> DSH · 原型演示</div>':''}${esc(m.text)}</div>`).join('')}
function chatPanel(w){return `<aside class="chat" aria-label="相关对话"><div class="chathead">相关对话<button class="iconbtn" aria-label="收起对话" data-action="chat">${icon('close')}</button></div><div class="messages">${messages(w.id)}</div><form class="chatcompose" data-form="chat"><div class="chatcontext">${icon('file')} 正在讨论：${w.title}</div><textarea aria-label="补充工作要求" placeholder="针对这份结果，补充你的想法…" required></textarea><div class="row between"><span class="small muted">示例对话</span><button class="send" aria-label="发送补充要求">${icon('send')}</button></div></form></aside>`}
function detail(){const w=works.find(w=>w.id===selected);return `<div class="content detail"><div class="detailhead"><div class="row between"><div class="row"><span class="small muted">${w.project}</span><span class="small muted">/</span><span class="small muted">工作详情</span></div><div class="row">${w.id==='chrome'?`<button class="btn ${accepted?'':'primary'}" data-action="accept">${icon('check')}${accepted?'已查看':'标记已查看'}</button>`:''}<button class="btn" data-action="chat">${icon('chat')}${chatOpen?'收起对话':'相关对话'}</button></div></div><h1>${w.title}</h1><div class="row">${badge(...status(w))}<span class="small muted">${w.time}更新 · 示例工作</span></div><div class="tabs">${[['overview','概览'],['result',w.id==='review'?'审查结果':'当前结果'],['record','执行记录']].map(t=>`<button class="tab ${detailTab===t[0]?'active':''}" data-detail-tab="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="detailgrid ${chatOpen?'withchat':''}"><div class="object">${documentBody(w)}</div>${chatOpen?chatPanel(w):''}</div></div>`}
function scratch(){const id=discussionId();chats[id]||=[];return `<div class="content"><div class="conversation"><div class="heading"><div class="eyebrow">${id!=='scratch'?'项目讨论':'临时对话'}</div><h1>${id!=='scratch'?esc(id.split(':')[1]):'随手聊聊'}</h1><p>${id!=='scratch'?'这段讨论保留在当前项目下。':'先聊起来，需要的时候再收进项目。'}</p></div><div class="messages">${id==='scratch'?messages(id):chats[id].map(m=>`<div class="message ${m.role}">${esc(m.text)}</div>`).join('')}</div>${composer()}</div></div>`}
function render(){nav.innerHTML=[['home','home','总览'],['inbox','inbox','需要我处理'],['running','play','正在进行'],['recent','clock','最近工作']].map(n=>`<button class="navitem ${route===n[0]?'active':''}" data-route="${n[0]}">${icon(n[1])}${n[2]}${n[0]==='inbox'?`<span class="count">${pending()}</span>`:n[0]==='running'?`<span class="count">${paused?0:1}</span>`:''}</button>`).join('')+`<div class="navlabel"><span>项目</span><span>3</span></div>`+[['deepseek-harness','#738fd4'],['easyGo','#65a18d'],['easyReader','#a790be']].map(p=>`<button class="navitem ${route==='project:'+p[0]?'active':''}" data-route="project:${p[0]}"><i class="projectdot" style="background:${p[1]}"></i>${p[0]}</button>`).join('');const names={home:'总览',inbox:'需要我处理',running:'正在进行',recent:'最近工作',scratch:'随手聊聊',tools:'能力与工具'};document.getElementById('crumb').innerHTML=`${icon('layers')}<button data-route="home">工作空间</button><span>/</span><strong>${route==='detail'?works.find(w=>w.id===selected).title:esc(names[route]||route.split(':')[1]||'总览')}</strong>`;
 if(route==='home')main.innerHTML=home();else if(route.startsWith('project:'))main.innerHTML=projectView(route.slice(8));else if(route==='detail')main.innerHTML=detail();else if(route==='scratch'||route.startsWith('discussion:'))main.innerHTML=scratch();else if(route==='tools')main.innerHTML=`<div class="content"><div class="heading"><div class="eyebrow">工作空间</div><h1>能力与工具</h1><p>需要的时候，再展开执行背后的细节。</p></div><div class="tools">${[['globe','浏览器协作','围绕当前页面读取材料、讨论并执行操作。'],['play','后台队列','查看需要持续执行的工作和等待原因。'],['layers','架构与插件','检查当前环境的能力组成和插件状态。'],['clock','工作观测','回看执行过程、运行记录和耗时。']].map(t=>`<div class="toolcard"><h3 class="row">${icon(t[0])}${t[1]}</h3><p>${t[2]}</p><button class="textbtn" ${t[1]==='后台队列'?'data-route="running"':'data-action="tool"'}>打开 ${icon('arrow')}</button></div>`).join('')}</div></div>`;else main.innerHTML=`<div class="content"><div class="heading"><div class="eyebrow">工作空间</div><h1>${names[route]}</h1><p>${route==='inbox'?'把需要你判断的事情放在一起。':route==='running'?'看清进展、等待原因和已经产生的结果。':'从上次停下的地方继续。'}</p></div>${route==='inbox'?attention():workList(route==='running'?works.filter(w=>w.id==='research'):works)}</div>`;document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));document.querySelectorAll('.sidefoot [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route))}
function go(next,push=true){route=next;document.getElementById('app').classList.remove('menuopen');if(push)history.pushState(null,'',`#${route==='detail'?'work/'+selected:route}`);render();window.scrollTo({top:0})}
function openWork(id){selected=id;detailTab='result';chatOpen=false;go('detail')}
function modal(html){dialog.innerHTML=html;if(!dialog.open)dialog.showModal()}
function showSearch(q){const items=works.filter(w=>(w.title+w.project).toLowerCase().includes(q.toLowerCase()));document.getElementById('searchresults').innerHTML=items.length?items.map(w=>`<button class="workrow" data-work="${w.id}">${icon(w.icon)}<span>${w.title}<span class="workdesc">${w.project}</span></span></button>`).join(''):'<div class="empty">没有找到匹配的工作</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){projectTab='overview';go(b.dataset.route);return}if(b.dataset.work){dialog.close();openWork(b.dataset.work);return}if(b.dataset.detailTab){detailTab=b.dataset.detailTab;render();return}if(b.dataset.projectTab){projectTab=b.dataset.projectTab;render();return}const a=b.dataset.action;
 if(a==='new')go('scratch');else if(a==='chat'){chatOpen=!chatOpen;render()}else if(a==='menu')document.getElementById('app').classList.toggle('menuopen');else if(a==='accept'){accepted=!accepted;render();toast(accepted?'已标记查看 · 仅改变原型内状态':'已恢复为待查看')}else if(a==='pause'){paused=!paused;render();toast(paused?'演示：调研已暂停':'演示：调研已继续')}else if(a==='approve'){approved=true;render();toast('演示：已记录采用建议；没有执行真实操作')}else if(a==='projectchat')go('discussion:'+route.slice(8));else if(a==='close')dialog.close();else if(a==='search'){modal(`<div class="row between"><h2>搜索工作</h2><button class="iconbtn" data-action="close" aria-label="关闭搜索">${icon('close')}</button></div><input id="searchinput" aria-label="搜索标题或项目" placeholder="搜索标题或项目…"><div id="searchresults"></div>`);showSearch('');document.getElementById('searchinput').focus()}else if(a==='settings'){modal(`<div class="row between"><h2>工作空间设置</h2><button class="iconbtn" data-action="close" aria-label="关闭设置">${icon('close')}</button></div><div style="margin-top:20px"><div class="setting">运行环境<span>本地个人空间</span></div><div class="setting">知识资料<span>思源 · 外部引用</span></div><div class="setting">交互状态<span>示例数据，刷新后重置</span></div></div><p>这个原型用于体验导航与布局，未接入模型、后台任务或个人配置。</p>`)}else if(['source','artifact','tool'].includes(a)){modal(`<div class="row between"><h2>${a==='source'?'关联的项目材料':a==='artifact'?'结果文件预览':'能力详情'}</h2><button class="iconbtn" data-action="close" aria-label="关闭详情">${icon('close')}</button></div><p>${a==='source'?'这里用于打开思源中的相关笔记，并保留当前工作位置。原型没有连接你的实际知识库。':a==='artifact'?'正式界面在这里预览产出文件，并可回看产生它的执行记录。这是文件预览入口的演示。':'这个入口容纳插件、运行观测等细节。原型暂时展示入口层级，未接入实际服务。'}</p>`)}});
document.addEventListener('input',e=>{if(e.target.id==='searchinput')showSearch(e.target.value)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const value=f.querySelector('textarea').value.trim();if(!value)return;const id=f.dataset.form==='chat'?selected:discussionId();chats[id]||=[];chats[id].push({role:'user',text:value},{role:'assistant',text:'已收到你的补充。这是本地交互演示，没有调用模型或执行任务。实际使用时，这段讨论会跟随当前工作保留。'});if(f.dataset.form==='chat')render();else go(id)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='collect')modal(`<div class="row between"><h2>收进项目</h2><button class="iconbtn" data-action="close" aria-label="关闭项目选择">${icon('close')}</button></div><p>保留这段对话，并在项目中继续。</p>${['deepseek-harness','easyGo','easyReader'].map(name=>`<button class="workrow" data-collect="${name}">${icon('folder')} ${name}</button>`).join('')}`);if(b.dataset.collect){const id='discussion:'+b.dataset.collect;chats[id]||=[];chats[id].push(...chats.scratch);chats.scratch=[];dialog.close();go(id);toast('已收进项目 · 仅保留于当前演示页面')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('app').classList.remove('menuopen');if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.matches('textarea'))e.target.closest('form').requestSubmit()});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function restore(){let hash;try{hash=decodeURIComponent(location.hash.slice(1))}catch{hash='home'}if(hash.startsWith('work/')&&works.some(w=>w.id===hash.slice(5))){selected=hash.slice(5);route='detail'}else if(['home','inbox','running','recent','scratch','tools'].includes(hash)||/^(project|discussion):(deepseek-harness|easyGo|easyReader)$/.test(hash))route=hash;else route='home';render()}
window.addEventListener('popstate',restore);restore();
</script></body></html>
