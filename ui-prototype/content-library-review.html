function listRender(){const tabs=[['all','全部'],['favorite','收藏'],['draft','草稿'],['archived','已归档']];$('#filters').innerHTML=tabs.map(([k,l])=>`<button data-filter="${k}" class="${filter===k?'active':''}" aria-pressed="${filter===k}">${l} <span>${counts(k)}</span></button>`).join('');const rows=visible();$('#list-count').textContent=`${rows.length} 条内容`;$('#items').innerHTML=rows.length?rows.map(e=>`<button class="entry ${selected===e.id?'selected':''}" data-entry="${e.id}" aria-current="${selected===e.id?'true':'false'}"><div class="entry-title"><span>${esc(title(e))}</span>${e.favorite?icon('star'):''}</div><p class="entry-preview">${esc((text(e)?.body||'').replace(/[#*>`]/g,'').replace(/\n/g,' '))}</p><div class="entry-meta">${e.draft?'<span class="draft-dot"></span><span>草稿</span>':`<span>${e.resultOf?'整理成果':e.source?'原材料 · 会话':'手动创建'}</span>`}<span class="dot"></span><span>${esc(e.updated)}</span></div></button>`).join(''):`<div class="list-empty">${query?'没有找到匹配的内容<br>试试其他关键词':filter==='favorite'?'收藏重要内容，方便下次找到':filter==='draft'?'没有正在编辑的草稿':filter==='archived'?'归档的内容会保留在这里':'内容库还是空的'}</div>`;$('#list-footer').innerHTML=icon('lock')+'已保存的内容与原会话独立保留'}
function sourceBlock(e){if(e.resultOf)return `<div class="result-origin">整理成果 · 原材料「${esc(e.resultOf)}」已保留</div>`;return e.source?`<div class="source"><div class="source-main">${icon('message')}<div><div class="source-label">保存自会话</div><div class="source-name">${esc(e.source)}</div></div></div><button data-action="source"><span>查看原消息</span>${icon('arrow')}</button></div>`:''}
function detailRender(){const e=current();if(!e){$('#workspace').innerHTML=`<div class="empty">${icon('file')}<h2>把值得保留的内容留在这里</h2><p>从会话保存一条回复，或新建一篇内容。<br>之后可以继续编辑，并保留每一次提交的版本。</p><button class="secondary" data-action="how">去会话保存</button><button class="primary" data-action="new">新建内容</button></div>`;return}if(editing){editRender();return}$('#workspace').innerHTML=`<div class="toolbar"><button class="icon mobile-back" data-action="back" aria-label="返回列表">${icon('back')}</button><span class="state">${icon('file')}${e.draft?'正在阅读已保存的草稿':e.archived?'已归档':'已保存'}${e.draft?'':` · 版本 ${e.versions.length}`}</span><div class="actions"><button class="icon ${e.favorite?'favorite-on':''}" data-action="favorite" aria-label="${e.favorite?'取消收藏':'收藏'}" title="${e.favorite?'取消收藏':'收藏'}">${icon('star')}</button><button class="quiet" data-action="history">${icon('history')}<span>${e.versions.length} 个版本</span></button><span class="separator"></span><button class="secondary" data-action="edit">${icon('edit')}${e.draft?'继续编辑':'编辑'}</button><div class="more-wrap"><button class="icon" data-action="more" aria-label="更多操作">${icon('more')}</button><div class="menu" id="menu" hidden><button data-action="copy">${icon('copy')}复制正文</button><button data-action="archive">${icon('archive')}${e.archived?'取消归档':'归档'}</button></div></div></div></div><div class="reader-scroll"><article class="document"><h1>${esc(title(e))}</h1><div class="doc-meta"><span>${esc(e.updated)} 更新</span><span>·</span><span>${(text(e)?.body||'').replace(/\s/g,'').length} 字</span><span>·</span><span>${e.draft?'有未提交的草稿':'已提交版本'}</span></div>${sourceBlock(e)}${suggestionsBlock(e)}<div class="prose">${markdown(text(e)?.body||'')}</div><div class="doc-bottom">${icon('check')}内容已保留${e.source?'，原会话不会因编辑而改变':''}</div></article></div>`}
function render(){listRender();detailRender();renderQueueStrip()}
function dirty(){return buffer&&(!buffer.base||buffer.title!==buffer.base.title||buffer.body!==buffer.base.body)}
function leaveEditor(){if(editing&&dirty()&&!confirm('这次编辑尚未保存。放弃改动并离开？'))return false;editing=false;buffer=null;preview=false;return true}
function beginEdit(isNew=false){if(!leaveEditor())return;if(isNew){selected=null;buffer={title:'',body:'',base:null}}else{const t=text(current());buffer={title:t.title,body:t.body,base:{...t}}}editing=true;$('#app').classList.add('detail-open');listRender();editRender()}
function editRender(){const isNew=!current();$('#workspace').innerHTML=`<div class="toolbar"><button class="quiet" data-action="cancel">${icon('back')}返回阅读</button><span class="state">${isNew?'新建内容':'编辑草稿'}</span><button class="quiet" data-action="preview">${preview?'返回编辑':'预览排版'}</button></div><div class="reader-scroll"><article class="document">${preview?`<h1>${esc(buffer.title||'未命名内容')}</h1><div class="prose">${markdown(buffer.body)}</div>`:`<input class="edit-title" id="edit-title" aria-label="内容标题" placeholder="给内容起个标题" value="${esc(buffer.title)}"><div class="editor-label"><span>正文 · 支持 Markdown</span><span>草稿不会覆盖已提交版本</span></div><textarea class="editor-body" id="edit-body" aria-label="内容正文" placeholder="写下需要保留的内容…">${esc(buffer.body)}</textarea>`}</article></div><footer class="edit-footer"><p id="edit-status">${dirty()?'有尚未保存的改动':'草稿已保存'}</p><div class="actions"><button class="secondary" data-action="save" ${!dirty()?'disabled':''}>保存草稿</button><button class="primary" data-action="commit" ${!buffer.body.trim()?'disabled':''}>提交新版本</button></div></footer>`;for(const id of ['edit-title','edit-body'])$('#'+id)?.addEventListener('input',()=>{buffer[id==='edit-title'?'title':'body']=$('#'+id).value;$('#edit-status').textContent=dirty()?'有尚未保存的改动':'草稿已保存';$('[data-action="save"]').disabled=!dirty();$('[data-action="commit"]').disabled=!buffer.body.trim()})}
function save(commit=false){if(!buffer.body.trim()){toast('请先写下正文');return}let e=current();if(!e){e={id:Date.now(),title:buffer.title,source:null,saved:'刚刚',updated:'刚刚',favorite:false,archived:false,versions:[],draft:null};entries.unshift(e);selected=e.id}e.updated='刚刚';const saved={title:buffer.title.trim()||buffer.body.split('\n').find(l=>l.trim()).replace(/^[#>\-\s]+/,'').slice(0,40),body:buffer.body};if(commit){e.versions.push({...saved,time:'刚刚',label:e.versions.length?'编辑后提交':'首次提交'});e.draft=null;editing=false;buffer=null;render();toast(`已提交版本 ${e.versions.length}`)}else{e.draft=saved;buffer={...saved,base:{...saved}};render();toast('草稿已保存，版本尚未改变')}}
function toast(message,undo){clearTimeout(toastTimer);$('#toast').innerHTML=`<span class="toast-message">${icon('check')}${esc(message)}</span>${undo?'<button id="undo">撤销</button>':''}`;if(undo)$('#undo').onclick=()=>{undo();$('#toast').innerHTML=''};toastTimer=setTimeout(()=>{$('#toast').innerHTML=''},4500)}
function modal(name,html){$('#dialog-title').textContent=name;$('#dialog-content').innerHTML=html;$('#dialog').showModal()}
function showSource(){const e=current();modal('来源会话',`<div class="dialog-body"><div class="conversation-meta">${esc(e?.source||'认识 DeepSeek Harness')} · 今天 11:05</div><div class="bubble">你可以帮我做些什么？</div><div class="reply"><div class="small" style="margin-bottom:12px">已保存的原消息</div><div class="prose">${markdown(e?.versions[0]?.body||initialBody)}</div></div></div>`)}
function history(index){const e=current();if(!e.versions.length){toast('还没有提交版本');return}index??=e.versions.length-1;const v=e.versions[index];modal('版本历史',`<div class="version-layout"><div class="version-list">${e.versions.map((v,i)=>`<button data-version="${i}" class="version-item ${i===index?'active':''}"><strong>版本 ${i+1}${i===e.versions.length-1?' · 当前':''}</strong><small>${esc(v.time)}</small><small>${esc(v.label)}</small></button>`).reverse().join('')}</div><div class="version-preview"><div class="small" style="margin-bottom:15px">已提交版本 · 只读</div><h3>${esc(v.title)}</h3><div class="prose">${markdown(v.body)}</div></div></div>`)}
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.entry){if(!leaveEditor())return;selected=Number(button.dataset.entry);$('#app').classList.add('detail-open');render();return}if(button.dataset.filter){if(!leaveEditor())return;filter=button.dataset.filter;if(!visible().some(e=>e.id===selected))selected=visible()[0]?.id??null;render();return}if(button.dataset.version!==undefined){history(Number(button.dataset.version));return}const e=current();switch(button.dataset.action){case 'back':$('#app').classList.remove('detail-open');break;case 'edit':beginEdit();break;case 'new':beginEdit(true);break;case 'cancel':if(leaveEditor())render();break;case 'save':save();break;case 'commit':save(true);break;case 'preview':preview=!preview;editRender();break;case 'source':showSource();break;case 'history':history();break;case 'favorite':e.favorite=!e.favorite;render();toast(e.favorite?'已收藏':'已取消收藏');break;case 'more':$('#menu').hidden=!$('#menu').hidden;break;case 'copy':try{await navigator.clipboard.writeText(text(e).body);toast('正文已复制')}catch{toast('浏览器未允许复制，请选中正文复制')}$('#menu').hidden=true;break;case 'archive':{e.archived=!e.archived;const archived=e.archived;selected=visible()[0]?.id??null;render();toast(archived?'已归档，可在“已归档”中找到':'已移回内容列表',()=>{e.archived=!archived;selected=e.id;filter=archived?'all':'archived';render()});break}}});
$('#search').addEventListener('input',event=>{query=event.target.value;listRender()});document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!$('#dialog').open){event.preventDefault();$('#search').focus()}if(event.key==='Escape'&&$('#menu'))$('#menu').hidden=true});$('#new').innerHTML=icon('plus')+'新建内容';$('#new').onclick=()=>beginEdit(true);$('#search-icon').innerHTML=icon('search');$('#close-dialog').innerHTML=icon('close');$('#close-dialog').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog'))$('#dialog').close()});$('#reset').onclick=()=>{if(!leaveEditor())return;resetSuggestions();entries=seed();selected=1;filter='all';query='';$('#search').value='';render();toast('已恢复示例内容')};render();
</script>
</body>
</html>
