<script>

const initial=()=>({view:'dashboard',agent:'Codex',quote:null,side:window.innerWidth>900,drawer:false,run:'idle'});
let state=initial(),timer=null,toastTimer=null,messages={},drafts={},policy={project:[true,true],tests:[true,true],github:[true,false],browser:[false,false]};

function home(){return head('接着上次的工作','方案已留在这里，不必寻找上一次会话。','<span class="tag good"><span class="dot"></span>本地项目</span>')+`<section class="resume"><div class="resume-stripe"></div><div class="resume-body"><div class="row between"><span class="meta">上次打开的对象</span><span class="tag blue">设计中</span></div><h2>从会话列表，转向项目工作台</h2><p>保留原生 Agent，让方案、代码和证据成为可以持续协作的对象。</p><div class="resume-foot"><span class="meta">方案 v3 · 有 2 条讨论 · 来源已关联</span>${button('doc','继续阅读方案',true)}</div></div></section><div class="section-head"><h3>正在推进</h3><button class="bare" data-view="work">查看工作事项 →</button></div><div class="sheet"><div class="item"><span class="object-icon">${icon('code')}</span><div class="item-text"><button class="link-btn" data-view="work">自动衔接独立验证</button><div class="meta">Codex 实现 → DSH 验证 · 已有范围约定</div></div><span class="tag ${state.run==='running'?'blue':'good'}">${workStatus()}</span><button class="bare" data-view="diff" aria-label="打开代码差异">↗</button></div><div class="item"><span class="object-icon">${icon('file')}</span><div class="item-text"><button class="link-btn" data-view="source">整理跨 Agent 协作的产品讨论</button><div class="meta">原文已关联 · 结论仍是知识候选</div></div><span class="tag">待整理</span></div></div><div class="section-head"><h3>你离开后的变化</h3><span class="meta">演示时间线</span></div><div class="activity"><div class="event"><div class="row"><strong>方案更新到 v3</strong><span class="meta">10:42</span></div><p>将会话从主导航下沉到对象的相关记录。</p><button class="bare" data-view="doc">打开修改后的方案 →</button></div><div class="event"><div class="row"><strong>Codex 提交了一份修改草案</strong><span class="meta">10:18</span></div><p>代码变化与验证要求已关联到同一工作事项。</p><button class="bare" data-view="diff">查看差异 →</button></div><div class="event"><strong>产品讨论原文进入项目资料</strong><p>原文与摘要分开保留，尚未自动共享给 Agent。</p></div></div>`}
function doc(){return `<div class="doc-tools"><div class="row"><span class="tag">方案</span><span class="meta">项目 / 资料 / 项目工作台设计</span></div><div class="row">${button('source','查看来源')}<button class="btn" data-action="toggle-side">讨论</button></div></div><article class="paper"><span class="meta mono">DESIGN NOTE · v3 · 草案</span><h1>把工作留在项目里，<br>而不是留在某次会话里。</h1><div class="row wrap" style="margin:16px 0 24px"><span class="tag blue">待讨论</span><span class="meta">xbh 与 Agent 共同维护</span><span class="meta">基于项目状态 R42</span></div><p class="muted">这份方案讨论的是工作的组织方式。Session 依然可用，但不再决定你正在看什么、成果属于哪里。</p>${Object.entries(sections).map(([id,text])=>`<section class="doc-section ${state.quote?.id===id?'selected':''}"><h2>${['','项目先于会话','围绕对象协作','把证据和结论分开'][id]}</h2><p>${text}</p><button class="quote-action" data-action="quote" data-id="${id}">引用这一段，和成员讨论 ↗</button></section>`).join('')}<h2>这一版先做到什么</h2><div class="doc-rule"><span class="checkmark">✓</span><span>不开新会话，也能浏览资料和工作进展。</span></div><div class="doc-rule"><span class="checkmark">✓</span><span>换 Agent，不丢失当前对象和选中的引用。</span></div><div class="doc-rule"><span class="checkmark">✓</span><span>查看成果时，直接看到对应的验证证据。</span></div><footer class="row between wrap"><span class="meta">来源：产品讨论原文 / 示例第 1–3 条</span><button class="bare" data-view="source">查看原始讨论 →</button></footer></article>`}

function files(){return head('资料与成果','原文、方案、代码与证据，不需要从聊天记录里找回来。')+`<div class="sheet">${[['doc','方案','项目工作台设计','v3 · 2 条讨论','设计中'],['diff','代码','自动衔接独立验证','示例 Diff · 2 个文件','待审阅'],['evidence','报告','独立验证报告','示例检查 · 绑定固定版本','证据'],['source','原文','跨 Agent 协作产品讨论','完整示例记录 · 与摘要分开','仅人可见']].map(([v,type,title,detail,status])=>`<div class="item"><span class="object-icon">${icon(type==='代码'?'code':'file')}</span><div class="item-text"><button class="link-btn" data-view="${v}">${title}</button><div class="meta">${type} · ${detail}</div></div><span class="tag">${status}</span><button class="bare" data-view="${v}" aria-label="打开${title}">↗</button></div>`).join('')}</div><div class="section-head"><h3>知识候选</h3><span class="tag warn">尚未成为项目共识</span></div><div class="sheet" style="padding:22px"><h3>Session 不应决定项目导航</h3><p class="muted" style="margin:8px 0 15px">来自产品讨论的待验证结论，保留原文出处，不替代原始讨论。</p>${button('source','回到原文')}</div>`}

function evidence(){const ok=['verified','accepted'].includes(state.run);return head('独立验证报告','WD-24 / 交付证据 · 演示内容',`<span class="tag ${ok?'good':'warn'}">${ok?'验证通过':'尚未执行'}</span>`)+`<div class="sheet"><div class="metricstrip"><div><strong>${ok?'24 / 24':'—'}</strong><span class="meta">独立断言</span></div><div><strong>${ok?'一致':'—'}</strong><span class="meta">代码版本</span></div><div><strong>${ok?'3':'0'}</strong><span class="meta">关联证据</span></div></div>${[['检查计划','固定断言与检查器版本，在执行前确定。'],['执行日志','由独立检查生成，不以 Agent 回复替代。'],['代码身份','记录实际被检查的提交和内容摘要。']].map(([title,desc])=>`<div class="evidence-item"><span class="checkmark">${ok?'✓':'○'}</span><div><strong>${title}</strong><p class="muted">${desc}</p></div></div>`).join('')}</div><div class="notice" style="margin-top:20px">${ok?'示例检查已通过。接受交付只记录本页的人类决定，不会推送、合并或发布。':'还没有检查证据。可回到工作事项演示自动执行与验证；不能直接接受交付。'}</div><div class="toolbar">${!ok?'<button class="btn primary" data-action="run" '+(state.run==='running'?'disabled':'')+'>演示执行与验证</button>':state.run==='accepted'?'<span class="tag good">✓ 你已接受这次示例交付</span>':'<button class="btn primary" data-action="accept">接受示例交付</button>'}${button('diff','回看代码')}</div><details class="sheet" style="padding:16px 20px;margin-top:24px"><summary>证据来源与技术标识</summary><p class="meta mono" style="margin-top:12px">work: WD-24 / revision: R42 / fixture: demo-only<br>没有读取真实 Git、运行测试或生成真实证据。</p></details>`}
function source(){return head('产品讨论原文','用于原型的完整示例记录，不是导入的真实 GPT 会话。','<span class="tag">仅人可见</span>')+`<article class="paper"><div class="row between"><h2>从 Session-first 转向项目协作</h2><span class="meta">3 条示例记录</span></div>${[['你','我不满意目前以 Session 为中心的 UI。工作会跨会话、跨工具继续，不能每次都靠我搬运上下文。'],['GPT · 示例','可以把项目作为长期空间，把文档、代码与工作事项作为可直接打开的对象。讨论围绕对象展开。'],['你','保留原生 Agent 的能力。不要为了统一 UI，把它们都变成中央 Agent 的子代理。']].map(([who,text],i)=>`<section style="border-top:1px solid var(--line);padding:22px 0;margin-top:20px"><span class="meta">记录 ${i+1} · ${who}</span><p style="margin-top:10px">${text}</p></section>`).join('')}<footer><span class="tag warn">衍生结论需另行确认</span><p class="muted" style="margin-top:12px">“Session 不应决定项目导航”是关联的知识候选。候选修改不会覆盖这份原文。</p><div class="toolbar">${button('doc','查看关联方案')}</div></footer></article>`}
