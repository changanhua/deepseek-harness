<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="src/sidebar.css"><title>DSH 浏览器助手</title></head>
<body>
<svg width="0" height="0" aria-hidden="true" class="icon-defs"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 17 5-4 3 3 3-2 5 4"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="m16 3 5 5-4 2-3 5-2-2-6 6-1-1 6-6-2-2 5-3z"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v6l4 2"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.8-1.8.9-1.9-2.2-2.2-1.9.9-1.8-.8-.7-2h-3l-.7 2-1.8.8-1.9-.9L1 6.1 2 8l-.8 1.8-2 .7v3l2 .7L2 16l-.9 1.9L3.2 20l1.9-.9 1.8.8.7 2h3l.7-2 1.8-.8 1.9.9 2.1-2.1-.9-1.9.8-1.8z"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zm-9 5v10l9 5 9-5V8M12 13v10"/></symbol><symbol id="i-tree" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="5" rx="1"/><path d="M6 8v11h6M6 13h6"/><rect x="12" y="10" width="9" height="5" rx="1"/><rect x="12" y="17" width="9" height="5" rx="1"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 16a2 2 0 0 1-2 2H8l-5 3V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><path d="M7 8h9M7 12h6"/></symbol><symbol id="i-global" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</defs></svg>
<main class="shell">
<header class="topbar"><div class="brand"><span class="brandmark">DSH</span><strong>助手</strong><span id="connection-dot" class="connection-dot"></span><span id="connection-label" class="connection-label"></span></div><div class="top-actions"><button id="history-button" class="icon-button" type="button" aria-label="会话历史"><svg><use href="#i-history"/></svg></button><button id="top-new-session" class="icon-button" type="button" aria-label="新对话"><svg><use href="#i-plus"/></svg></button><button id="show-settings" class="icon-button" type="button" aria-label="连接与设置"><svg><use href="#i-settings"/></svg></button></div></header>
<nav class="main-nav" aria-label="浏览器助手主导航" role="tablist"><button type="button" role="tab" data-view="chat" aria-selected="true">对话</button><button type="button" role="tab" data-view="cognition" aria-selected="false">页面认知<span id="cognition-count" class="count">—</span></button><button type="button" role="tab" data-view="functions" aria-selected="false">功能<span id="function-count" class="count">—</span></button></nav>
<section id="notice" class="notice" hidden aria-live="polite"></section><section id="connection-panel" class="connection-panel" hidden></section>
<section id="settings" class="settings overlay" hidden><header><strong>连接与设置</strong><button id="hide-settings" class="icon-button" type="button" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button></header><label>DSH 地址<input id="base-url" inputmode="url" spellcheck="false" placeholder="http://127.0.0.1:3080"></label><label>网页操作引擎<select id="browser-engine"><option value="puppeteer">Puppeteer（推荐）</option><option value="dom">DOM 兼容模式</option></select></label><section id="site-access" class="site-access"></section><p id="model-selection" class="model-selection"></p><button id="configure-model" type="button">打开 DSH 模型设置 ↗</button><button id="save-settings" class="primary" type="button">保存并连接</button><button id="disconnect" type="button">断开连接</button></section>
<section id="target-panel" class="target-panel" aria-live="polite"></section>
<div class="content">
<section id="chat-panel" class="view-panel chat-panel" role="tabpanel"><section id="session-controls" class="session-controls" hidden><button id="session-new" class="primary" type="button">新对话</button><button id="session-switch" type="button">切换对话</button><section id="session-switch-menu" class="session-menu" hidden></section></section><div class="chat-scroll">
<section id="home" class="home"><div class="home-symbol"><svg><use href="#i-chat"/></svg></div><h1>今天，想做点什么？</h1><p>聊一个问题，完成一件事，做一个自己的工具。</p><div class="home-actions"><button type="button" class="home-action" data-starter="帮我梳理一个想法："><svg><use href="#i-chat"/></svg><span><strong>讨论一个想法</strong><small>从问题开始，随时继续</small></span></button><button type="button" class="home-action" data-starter="帮我做一个全局工具："><svg><use href="#i-box"/></svg><span><strong>做一个自己的工具</strong><small>描述用途，再边用边改</small></span></button><button type="button" class="home-action" id="home-functions"><svg><use href="#i-global"/></svg><span><strong>打开我的功能</strong><small>使用、修改和管理已交付功能</small></span></button></div><section class="recent"><h2 class="section-label">最近的对话</h2><div id="recent-list"></div></section><div class="home-session-actions"><button id="new-session" class="primary" type="button">新对话</button><button id="session-picker" type="button">继续对话</button></div><section id="session-menu" class="session-menu" hidden></section></section>
<section id="conversation" class="conversation" aria-live="polite" hidden></section><section id="pending-actions" class="pending-actions" aria-live="polite"></section><section id="action-approvals" class="action-approvals" hidden></section><section id="unresolved-actions" class="unresolved-actions" hidden></section></div></section>
<section id="cognition-panel" class="view-panel pane" hidden role="tabpanel"><header><div><h1>Agent 已掌握的页面</h1><p>查看实际读取范围、结构与遗漏。</p></div><button id="refresh-cognition" type="button">刷新</button></header><div id="cognition-content"></div></section>
<section id="functions-panel" class="view-panel pane" hidden role="tabpanel"><header><div><h1>我的功能</h1><p>打开使用，继续修改，或随时停止。</p></div><button id="create-function" type="button">＋ 创建</button></header><div class="feature-tabs"><button type="button" data-scope="global" aria-pressed="true">全局</button><button type="button" data-scope="page" aria-pressed="false">当前目标页面</button><button id="refresh-functions" type="button">刷新</button></div><div id="functions-content"></div></section>
</div>
<footer id="composer-wrap" class="composer-wrap"><section id="model-popover" class="model-popover" role="dialog" aria-labelledby="model-popover-title" hidden><header><strong id="model-popover-title">选择模型与推理强度</strong><button id="close-model-popover" class="icon-button" type="button" aria-label="关闭模型选择"><svg><use href="#i-close"/></svg></button></header><p id="model-picker-status" role="status"></p><div id="model-options"></div><div class="model-picker-actions"><button id="open-model-settings" type="button">打开 DSH 模型设置 ↗</button><button id="confirm-model" class="primary" type="button" hidden>应用到下一条消息</button></div></section><div class="draft-context"><span id="conversation-label">新对话</span><span>Enter 发送 · Shift + Enter 换行</span></div><div id="draft-images" class="draft-images"></div><div class="composer-shell"><textarea id="composer" rows="3" placeholder="有什么想做的，直接说…" aria-describedby="send-status model-status"></textarea><div class="composer-footer"><button id="attach-image" class="icon-button" type="button" aria-label="添加图片"><svg><use href="#i-image"/></svg></button><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><button id="composer-model" class="model-button" type="button" aria-haspopup="dialog" aria-controls="model-popover">选择模型</button><button id="send-queue" class="send-button" type="button" aria-label="发送"><svg><use href="#i-arrow"/></svg></button></div></div><small id="model-status" role="status" hidden></small><small id="send-status" role="status" hidden></small><div class="secondary-controls"><button id="send-steer" type="button">立即介入</button><button id="stop-session" type="button">停止</button></div></footer>
<section id="history-dialog" class="modal" role="dialog" hidden><header><h2>会话历史</h2><button type="button" class="icon-button" data-close-modal="history-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></header><div id="history-list"></div></section>
<section id="target-dialog" class="modal" role="dialog" hidden><header><h2>选择操作标签</h2><button type="button" class="icon-button" data-close-modal="target-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></header><p>固定后，切换浏览标签不会改变操作目标。</p><div id="target-candidates"></div></section>
</main><script type="module" src="src/sidebar.js"></script>
</body></html>
